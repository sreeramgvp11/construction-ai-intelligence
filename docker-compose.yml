version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: construction_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: construction_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: construction_ai_redis
    ports:
      - "6380:6379"

volumes:
  postgres_data:
